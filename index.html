<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Games</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>Mini Games</h1>
  <p class="intro">A collection of small web-based games.</p>

  <ul class="games">
    <li>
      <a class="game-card" href="./pixel-art">
        <h2>Pixel Art</h2>
        <p>Draw pixel art, fill, zoom, and save your creations.</p>
      </a>
    </li>
    <li>
      <a class="game-card" href="./matching-cards">
        <h2>Matching Cards</h2>
        <p>Flip cards and find all the matching pairs.</p>
      </a>
    </li>
    <li>
      <a class="game-card" href="./weekday">
        <h2>Weekday</h2>
        <p>Guess the day of the week of a random date.</p>
      </a>
    </li>
  </ul>

  <footer class="site-footer">
    <a href="https://github.com/mugnozzo/mini-games">Source on GitHub</a>
  </footer>
</div>
</body>
</html>
