<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Editor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="true" aria-controls="sidebar">☰</button>
    <h1>Pixel Art Editor</h1>
    <div class="field">
      <input type="text" id="title-input" value="Untitled" maxlength="60" aria-label="Title" placeholder="Title">
    </div>
    <nav class="header-links">
      <button type="button" id="fullscreen-toggle" class="other-games-link link-btn" aria-pressed="false">Fullscreen</button>
      <a class="other-games-link" href="../index.html">Other games</a>
      <a class="other-games-link" href="https://github.com/mugnozzo/mini-games">GitHub</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <section class="panel">
        <h2>Canvas</h2>
        <div class="field-column">
          <div class="field">
            <label for="width-input"><span class="icon icon-fit-width" aria-hidden="true"></span> Width: <span id="width-value">16</span></label>
            <input type="range" id="width-input" min="1" max="64" step="1" value="16">
          </div>
          <div class="field">
            <label for="height-input"><span class="icon icon-fit-height" aria-hidden="true"></span> Height: <span id="height-value">16</span></label>
            <input type="range" id="height-input" min="1" max="64" step="1" value="16">
          </div>
        </div>
        <p class="hint" id="size-hint"></p>
        <div class="field">
          <label for="zoom-slider"><span class="icon icon-zoom" aria-hidden="true"></span> <span id="zoom-value">16px</span></label>
          <input type="range" id="zoom-slider" min="4" max="64" step="1" value="16" aria-label="Zoom, cell size in pixels">
        </div>
        <div class="toolbar" id="zoom-mode-toolbar">
          <button type="button" class="zoom-mode-btn icon-btn" id="zoom-manual-btn" data-mode="manual" aria-pressed="false" title="Manual zoom" aria-label="Manual zoom"><span class="icon icon-manual-slider" aria-hidden="true"></span></button>
          <button type="button" class="zoom-mode-btn icon-btn" id="fit-width-btn" data-mode="fit-width" aria-pressed="false" title="Fit width" aria-label="Fit width"><span class="icon icon-fit-width" aria-hidden="true"></span></button>
          <button type="button" class="zoom-mode-btn icon-btn" id="fit-height-btn" data-mode="fit-height" aria-pressed="false" title="Fit height" aria-label="Fit height"><span class="icon icon-fit-height" aria-hidden="true"></span></button>
          <button type="button" class="zoom-mode-btn icon-btn active" id="fit-contain-btn" data-mode="contain" aria-pressed="true" title="Contain" aria-label="Contain"><span class="icon icon-contain" aria-hidden="true"></span></button>
        </div>
      </section>

      <section class="panel">
        <h2>Tool</h2>
        <div class="toolbar" id="tool-toolbar">
          <button type="button" class="tool-btn icon-btn active" data-tool="paint" aria-pressed="true" title="Paint" aria-label="Paint"><span class="icon icon-brush" aria-hidden="true"></span></button>
          <button type="button" class="tool-btn icon-btn" data-tool="fill" aria-pressed="false" title="Fill" aria-label="Fill"><span class="icon icon-fill" aria-hidden="true"></span></button>
          <button type="button" class="tool-btn icon-btn" data-tool="picker" aria-pressed="false" title="Pick color" aria-label="Pick color"><span class="icon icon-color-picker" aria-hidden="true"></span></button>
          <button type="button" id="clear-btn" class="icon-btn" title="Clear All" aria-label="Clear All"><span class="icon icon-clear-screen" aria-hidden="true"></span></button>
        </div>
        <div class="field">
          <label for="brush-slider">Brush size: <span id="brush-value">1</span></label>
          <input type="range" id="brush-slider" min="1" max="8" step="1" value="1">
        </div>
        <p class="hint">Click paints with the current color. Right-click always erases. Picker samples a color from the canvas.</p>
        <h2>Color</h2>
        <div class="field">
          <input type="color" id="color-picker" value="#000000">
        </div>
        <div class="swatches" id="swatches"></div>
        <div class="swatches" id="used-swatches"></div>
      </section>

      <section class="panel">
        <h2>History</h2>
        <div class="toolbar">
          <button type="button" id="undo-btn" class="icon-btn" aria-label="Undo" title="Undo" disabled><span class="icon icon-undo" aria-hidden="true"></span></button>
          <button type="button" id="redo-btn" class="icon-btn" aria-label="Redo" title="Redo" disabled><span class="icon icon-redo" aria-hidden="true"></span></button>
        </div>
      </section>

      <section class="panel">
        <h2>Export/import image</h2>
        <div class="toolbar">
          <button type="button" id="save-json-btn">Save JSON</button>
          <button type="button" id="load-json-btn">Load JSON</button>
        </div>
        <input type="file" id="load-json-input" accept=".json,application/json" hidden>
        <p class="hint" id="file-error" role="alert"></p>
        <div class="field">
          <label for="scale-input">PNG scale</label>
          <input type="number" id="scale-input" min="1" max="32" step="1" value="10">
        </div>
        <button type="button" id="export-png-btn">Export PNG</button>
        <h2>Import image</h2>
        <div class="field">
          <label for="import-max-size-input">Max size: <span id="import-max-size-value">64</span></label>
          <input type="range" id="import-max-size-input" min="1" max="64" step="1" value="64">
        </div>
        <button type="button" id="import-image-btn">Import Image</button>
        <input type="file" id="import-image-input" accept="image/*" hidden>
        <p class="hint">Resizes the canvas to fit the image (longer side = max size), then pixelizes it.</p>
        <p class="hint" id="image-error" role="alert"></p>
      </section>
    </aside>

    <main class="canvas-area" id="canvas-area">
      <div id="grid" class="grid" style="--cols: 16;"></div>
    </main>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/grid.js"></script>
<script src="js/zoom.js"></script>
<script src="js/palette.js"></script>
<script src="js/tools.js"></script>
<script src="js/history.js"></script>
<script src="js/fileio.js"></script>
<script src="js/imageimport.js"></script>
<script src="js/app.js"></script>
</body>
</html>
