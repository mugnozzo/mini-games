<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matching Cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Matching Cards</h1>
</header>

<main>

  <!-- ===== SETUP SCREEN ===== -->
  <section id="setup-screen" class="screen">
    <form id="setup-form">

      <div class="field">
        <label for="cardCountSelect">Number of cards</label>
        <select id="cardCountSelect"></select>
      </div>

      <div class="field">
        <label for="playerCountInput">Number of players</label>
        <input type="number" id="playerCountInput" min="1" max="6" value="1">
      </div>

      <div class="field" id="playerNamesField">
        <label>Player names</label>
        <div id="playerNamesList"></div>
      </div>

      <div class="field">
        <label>Grid layout</label>
        <div class="radio-row">
          <label><input type="radio" name="gridMode" value="auto" checked> Auto (fit to screen)</label>
          <label><input type="radio" name="gridMode" value="manual"> Manual</label>
        </div>
      </div>

      <div class="field" id="autoGridField">
        <span id="autoGridDisplay" class="grid-readout"></span>
        <button type="button" id="refitButton">Re-fit to screen</button>
      </div>

      <div class="field hidden" id="manualGridField">
        <label for="manualRows">Rows</label>
        <input type="number" id="manualRows" min="1">
        <label for="manualCols">Cols</label>
        <input type="number" id="manualCols" min="1">
        <span id="manualGridError" class="error-text"></span>
      </div>

      <button type="submit" id="startGameButton">Start Game</button>
    </form>
  </section>

  <!-- ===== GAME SCREEN ===== -->
  <section id="game-screen" class="screen hidden">
    <div class="game-bar">
      <div id="timerDisplay" class="timer">00:00</div>
      <div id="scoreboard" class="scoreboard"></div>
    </div>
    <div id="game-board" class="game-board"></div>
  </section>

  <!-- ===== END SCREEN ===== -->
  <section id="end-screen" class="screen hidden">
    <h2 id="endTitle"></h2>
    <table id="summaryTable" class="summary-table">
      <thead>
        <tr><th>Player</th><th>Matches</th><th>Wrong tries</th><th>Total tries</th></tr>
      </thead>
      <tbody id="summaryTableBody"></tbody>
    </table>
    <p id="elapsedTimeSummary"></p>
    <button type="button" id="playAgainButton">Play Again</button>
  </section>

</main>

<script defer src="script.js"></script>
</body>
</html>
